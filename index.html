<style>
:root{--bg:#fbf7f2;--card:#fff;--tx:#1f2330;--mu:#6b7080;--pr:#c8283c;--ac:#2d6a4f;--bd:#eadfd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font-family:"Sinhala Sangam MN","Sinhala MN","Noto Sans Sinhala","Noto Sans JP",-apple-system,system-ui,sans-serif;background-color:var(--bg)}

nav button.on{color:var(--pr);font-weight:700}nav b{display:block;font-size:20px}
main{max-width:760px;margin:0 auto;padding:16px 14px 100px}

.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.g5{grid-template-columns:repeat(5,1fr)}

canvas{width:100%;height:240px;border:2px dashed var(--bd);border-radius:14px;background:var(--card);touch-action:none}

#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:9;display:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 46%,rgba(220,50,70,.11) 0,rgba(220,50,70,.11) 19vmin,transparent calc(19vmin + 1px))}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s;animation:sfade .5s 4.5s forwards}@keyframes sfade{to{opacity:0;visibility:hidden}}#splash.out{opacity:0;pointer-events:none}
#splash .sw{position:relative;width:180px;height:180px}#splash .ring{position:absolute;inset:0;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#splash .ring span{position:absolute;left:50%;top:50%;width:28px;margin:-14px 0 0 -14px;text-align:center;font-family:'Noto Sans JP',sans-serif;font-size:22px;color:var(--pr);transform:rotate(calc(var(--i)*36deg)) translateY(-78px)}
#splash .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans JP',sans-serif;font-size:30px;font-weight:700}
@media(prefers-reduced-motion:reduce){#splash .ring{animation:none}}
@media(prefers-reduced-motion:no-preference){#app.vin{animation:vin .32s ease}@keyframes vin{from{opacity:0;transform:translateY(12px)}}nav button.on b{animation:pop .35s}@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.2)}100%{transform:scale(1)}}}
body.lg main{margin:0 auto}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em}.ic svg{width:100%;height:100%}
#sk{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}#sk i{position:absolute;top:-30px;background:linear-gradient(135deg,#ffd6e3,#ff9ebb);border-radius:100% 0 100% 0;opacity:.85;animation:fall linear infinite}@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}50%{transform:translate(45px,50vh) rotate(180deg)}100%{transform:translate(-25px,105vh) rotate(360deg)}}@media(prefers-reduced-motion:reduce){#sk{display:none}}

const GD=[['වාක්‍ය රටාව (SOV)','ජපන් වාක්‍යයක ක්‍රියාපදය සෑම විටම අවසානයේ එයි (සිංහල වාගේම): කර්තෘ → කර්මය → ක්‍රියාව.','わたしは りんごを たべます|watashi wa ringo o tabemasu|මම ඇපල් කනවා',[['わたしは りんごを たべます — ක්‍රියාපදය කුමක්ද?','たべます','りんご','わたし']]],['は සහ です','は (“wa” ලෙස කියවයි) වාක්‍යයේ මාතෘකාව පෙන්වයි. です යනු වාක්‍යය ගෞරවනීයව අවසන් කරන වචනයයි.','わたしは がくせいです|watashi wa gakusei desu|මම ශිෂ්‍යයෙක්;これは ほんです|kore wa hon desu|මෙය පොතකි',[['වාක්‍යයක මාතෘකාව පෙන්වන は කියවන්නේ කෙසේද?','wa','ha','ba'],['わたしは がくせい＿＿ (මම ශිෂ්‍යයෙක්) — හිස් තැනට?','です','ます','を']]],['ප්‍රශ්න (か)','වාක්‍යයක් අගට か යෙදූ විට එය ප්‍රශ්නයක් වේ.','これは ほんですか|kore wa hon desu ka|මෙය පොතක්ද?;はい、ほんです|hai, hon desu|ඔව්, පොතකි',[['これは ほんです＿＿ (මෙය පොතක්ද?) — හිස් තැනට?','か','を','は']]],['ඍණ වාක්‍ය','です හි ඍණ ආකාරය ではありません වේ (කථන ව්‍යවහාරයේ じゃありません).','これは ほんでは ありません|kore wa hon dewa arimasen|මෙය පොතක් නොවේ',[['これは ほん＿＿ (මෙය පොතක් නොවේ) — හිස් තැනට?','ではありません','です','ですか']]],['を (කර්ම පදය)','ක්‍රියාවට ලක්වන දේට を යෙදේ. “o” ලෙස කියවයි.','みずを のみます|mizu o nomimasu|වතුර බොනවා',[['みず＿＿ のみます (වතුර බොනවා) — හිස් තැනට?','を','に','で']]],['に (ගමනාන්තය / වේලාව)','යන තැන හෝ නිශ්චිත වේලාව පෙන්වයි.','がっこうに いきます|gakkou ni ikimasu|පාසලට යනවා;しちじに おきます|shichiji ni okimasu|හත පැයට නැඟිටිනවා',[['がっこう＿＿ いきます (පාසලට යනවා) — හිස් තැනට?','に','を','で']]],['で (ස්ථානය / මාධ්‍යය)','ක්‍රියාව සිදුවන තැන හෝ භාවිත කරන දේ (බස් රථය වැනි) පෙන්වයි.','がっこうで べんきょうします|gakkou de benkyou shimasu|පාසලේදී ඉගෙන ගන්නවා;バスで いきます|basu de ikimasu|බස් එකෙන් යනවා',[['がっこう＿＿ べんきょうします (පාසලේදී ඉගෙන ගන්නවා) — හිස් තැනට?','で','を','に']]],['が (පැවැත්ම)','ඉන්නවා / තියෙනවා (います / あります) සමඟ පැවැත්ම දක්වන විෂයට が යෙදේ.','ねこが います|neko ga imasu|පූසෙක් ඉන්නවා',[['ねこ＿＿ います (පූසෙක් ඉන්නවා) — හිස් තැනට?','が','を','で']]],['ます ආකාර','ක්‍රියාපදයට ます (වර්තමාන / අනාගත), ません (නැහැ), ました (අතීත) යෙදේ.','たべます|tabemasu|කනවා;たべません|tabemasen|කන්නේ නැහැ;たべました|tabemashita|කෑවා',[['たべません යන්නෙහි තේරුම?','කන්නේ නැහැ','කනවා','කෑවා'],['のみました යන්නෙහි තේරුම?','බිව්වා','බොනවා','බොන්නේ නැහැ']]],['විශේෂණ','い-විශේෂණයක් ඍණ කිරීමට අගට ඇති い ඉවත් කර くない යෙදේ.','おいしい|oishii|රසයි;おいしくない|oishikunai|රසයි නැහැ',[['おいしい (රසයි) හි ඍණ ආකාරය?','おいしくない','おいしいません','おいしじゃない']]]];
function gram(){return`<h2>මූලික ව්‍යාකරණ</h2><div class='mu'>සරල සිංහලෙන් පැහැදිලි කිරීම්, උදාහරණ සහ පරීක්ෂණයක්.</div>`+GD.map((g,i)=>`<div class='card'><b>${i+1}. ${g[0]}</b><p>${g[1]}</p>${g[2].split(';').map(s=>{const p=s.split('|');return`<div style='border-left:4px solid var(--pr);padding-left:10px;margin:6px 0'><div style="font-family:'Noto Sans JP';font-size:20px">${p[0]}</div><div class='mu'>${p[1]}</div><div>${p[2]}</div></div>`}).join('')}</div>`).join('')+`<button class='btn' data-a='gq'>📝 ව්‍යාකරණ පරීක්ෂණය</button>`}

return`<div style='text-align:center;padding-top:8vh'><div class='big' style='font-size:56px;color:var(--pr)'>日本語</div><h1>NIPPONGO LEARN</h1><div class='mu'>ජපන් භාෂාව ඉගෙන ගන්න — නමක් පමණක් ඇතුළත් කර ඇතුල් වන්න</div></div><div class='card'><label>ඔබේ නම<input type='text' id='ln' maxlength='30' placeholder='නම' autocomplete='off'></label><br><br><button class='btn' data-a='li'>ඇතුල් වන්න</button></div>${us.length?`<div class='card'><b>මෙම උපාංගයේ ගිණුම්</b>${us.map(u=>`<button class='btn sec' style='margin-top:8px' data-a='lu' data-t="${esc(u[0])}">${esc(u[0])} · ${u[1]} XP</button>`).join('')}</div>`:''}<div class='mu' style='text-align:center'>මුරපදයක් නැත — ප්‍රගතිය ඔබේ උපාංගයේම සුරැකේ.</div>`}

KEY=k;S={...def(),...(d||{}),name,started:1,user:{name,at:day(),mode:'name'}};try{localStorage.setItem(LK,name)}catch(e){}save();V='home';cur=null;render()}

 <div class="card"><b>අක්ෂර සංඛ්‍යාලේඛන</b>${Object.keys(S.cards).map(k=>{const c=S.cards[k];return`<div class="row"><span style="font-size:22px">${k}</span><span class="mu">නිවැරදි ${c.c} · වැරදි ${c.w} · ${Math.round(c.c/(c.c+c.w||1)*100)}% · ඊළඟ: ${c.due}</span></div>`}).join("")||'<div class="mu">තවම දත්ත නැත</div>'}</div>`}

 <div class="card"><div class="grid"><button class="btn sec" data-a="th" data-t="light">☀️ ආලෝක</button><button class="btn sec" data-a="th" data-t="dark">🌙 අඳුරු</button></div><br><label><input type="checkbox" id="mu" ${S.mute?"checked":""}> හඬ නිශ්ශබ්ද කරන්න</label><br><br><label>හඬ වේගය <input type="range" id="rt" min="0.5" max="1.2" step="0.1" value="${S.rate}"></label><div class="mu">හඬ: ඔබේ browser එකේ TTS (ස්වදේශික ජපන් පටිගත කිරීම් නොවේ). ඇතැම් Android උපාංගවල ජපන් හඬ ස්ථාපනය කළ යුතුය.</div></div>
 <div class="card"><button class="btn sec" data-a="exp">⬇ දත්ත බැකප් (JSON)</button><br><br><label class="btn sec" style="display:block;text-align:center">⬆ බැකප් ආනයනය<input type="file" id="imp" accept=".json" hidden></label><br><button class="btn" data-a="reset" style="background:#8b1e2d">🗑 ප්‍රගතිය යළි පිහිටුවන්න</button></div>
 <div class="mu">දත්ත ඔබේ උපාංගයේ localStorage හි සුරැකේ. Browser දත්ත මකා දැමුවහොත් නැති විය හැක — නිතර බැකප් ගන්න.</div>`}
